<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 350px;
            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 11px;

            margin-bottom: 15px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 5px;
        }

        button {
            width: 100%;

            padding: 11px;

            border: none;

            border-radius: 5px;

            background: #2563eb;

            color: white;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #2563eb;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Admin Login</h2>

        <form id="adminLoginForm">

            <input
                type="email"
                id="email"
                placeholder="Admin Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <a class="back" href="../frontend/login.html">
            ← Student Login
        </a>

    </div>

<script>

    document.getElementById("adminLoginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const response = await fetch("/login", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })

        });

        const data = await response.json();

        if (response.ok && data.user.role === "admin") {

            localStorage.setItem("admin", JSON.stringify(data.user));

            window.location.href = "/admin/admin-dashboard.html";

        } else {

            alert("Invalid admin credentials.");

        }

    });

</script>

</body>

</html>
