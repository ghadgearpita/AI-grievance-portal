<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 240px;
            background: #1e293b;
            color: white;
            padding: 25px 15px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #334155;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            padding: 30px;
        }

        .top-bar {
            margin-bottom: 25px;
        }

        .top-bar h1 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .top-bar p {
            color: #64748b;
        }

        /* =========================
           NOTIFICATION
        ========================= */

        #notification {
            display: none;
            background: #dcfce7;
            color: #166534;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        /* =========================
           STAT CARDS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 15px;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 30px;
            font-weight: bold;
            color: #1e293b;
        }

        /* =========================
           RECENT GRIEVANCES
        ========================= */

        .section {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            color: #475569;
            background: #f8fafc;
        }

        td {
            color: #475569;
        }

        .status {
            font-weight: bold;
        }

        .empty-message {
            color: #64748b;
            padding: 15px 0;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            .layout {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            .main {
                padding: 20px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="layout">


    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <h2>Admin Panel</h2>

        <a href="/admin/admin-dashboard.html">
            Dashboard
        </a>

        <a href="/admin/admin-grievances.html">
            Grievances
        </a>

        <a href="/admin/admin-login.html"
           onclick="logout()">
            Logout
        </a>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================= -->

    <main class="main">


        <!-- =========================
             TOP BAR
        ========================= -->

        <div class="top-bar">

            <h1>Admin Dashboard</h1>

            <p>
                Welcome, College Admin
            </p>

        </div>


        <!-- =========================
             NOTIFICATION
        ========================= -->

        <div id="notification">
            🔔 New grievance received
        </div>


        <!-- =========================
             STATISTICS
        ========================= -->

        <div class="stats">


            <div class="stat-card">

                <h3>
                    Total Grievances
                </h3>

                <p id="totalCount">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Pending
                </h3>

                <p id="pendingCount">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    In Progress
                </h3>

                <p id="progressCount">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>
                    Resolved
                </h3>

                <p id="resolvedCount">
                    0
                </p>

            </div>


        </div>


        <!-- =========================
             RECENT GRIEVANCES
        ========================= -->

        <div class="section">

            <h2>
                Recent Grievances
            </h2>


            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Grievance ID
                            </th>

                            <th>
                                Student
                            </th>

                            <th>
                                Title
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Status
                            </th>

                        </tr>

                    </thead>


                    <tbody id="recentGrievances">

                        <tr>

                            <td colspan="5">
                                Loading...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>


    </main>

</div>


<script>

    /* =====================================================
       CHECK ADMIN LOGIN
    ===================================================== */

    const admin =
        JSON.parse(
            localStorage.getItem("admin")
        );


    if (!admin) {

        window.location.href =
            "/admin/admin-login.html";

    }


    /* =====================================================
       LOAD STATISTICS
    ===================================================== */

    async function loadStatistics() {

        try {

            const response =
                await fetch(
                    "http://127.0.0.1:5000/admin/statistics"
                );


            const data =
                await response.json();


            document.getElementById(
                "totalCount"
            ).textContent =
                data.total;


            document.getElementById(
                "pendingCount"
            ).textContent =
                data.pending;


            document.getElementById(
                "progressCount"
            ).textContent =
                data.in_progress;


            document.getElementById(
                "resolvedCount"
            ).textContent =
                data.resolved;


        } catch (error) {

            console.error(
                "Failed to load statistics:",
                error
            );

        }

    }


    /* =====================================================
       LOAD RECENT GRIEVANCES
    ===================================================== */

    async function loadRecentGrievances() {

        try {

            const response =
                await fetch(
                    "http://127.0.0.1:5000/admin/grievances"
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to fetch grievances"
                );

            }


            const grievances =
                await response.json();


            const tableBody =
                document.getElementById(
                    "recentGrievances"
                );


            tableBody.innerHTML = "";


            if (grievances.length === 0) {

                tableBody.innerHTML = `

                    <tr>

                        <td colspan="5"
                            class="empty-message">

                            No grievances submitted yet.

                        </td>

                    </tr>

                `;

                return;

            }


            /* Show only the latest 5 */

            const recent =
                grievances.slice(0, 5);


            recent.forEach(
                function(grievance) {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    row.innerHTML = `

                        <td>
                            ${grievance.grievance_id}
                        </td>

                        <td>
                            ${grievance.student_name}
                        </td>

                        <td>
                            ${grievance.title}
                        </td>

                        <td>
                            ${grievance.category}
                        </td>

                        <td class="status">
                            ${grievance.status}
                        </td>

                    `;


                    tableBody.appendChild(
                        row
                    );

                }
            );


        } catch (error) {

            console.error(
                "Failed to load grievances:",
                error
            );


            document.getElementById(
                "recentGrievances"
            ).innerHTML = `

                <tr>

                    <td colspan="5">

                        Failed to load grievances.

                    </td>

                </tr>

            `;

        }

    }


    /* =====================================================
       CHECK FOR NEW GRIEVANCES
    ===================================================== */

    let knownTotal = null;


    async function checkForNewGrievances() {

        try {

            const response =
                await fetch(
                    "http://127.0.0.1:5000/admin/statistics"
                );


            const data =
                await response.json();


            if (
                knownTotal !== null
                &&
                data.total > knownTotal
            ) {

                const notification =
                    document.getElementById(
                        "notification"
                    );


                notification.style.display =
                    "block";


                notification.textContent =
                    "🔔 New grievance received";


                setTimeout(
                    function() {

                        notification.style.display =
                            "none";

                    },
                    5000
                );


                loadRecentGrievances();

            }


            knownTotal =
                data.total;


            document.getElementById(
                "totalCount"
            ).textContent =
                data.total;


            document.getElementById(
                "pendingCount"
            ).textContent =
                data.pending;


            document.getElementById(
                "progressCount"
            ).textContent =
                data.in_progress;


            document.getElementById(
                "resolvedCount"
            ).textContent =
                data.resolved;


        } catch (error) {

            console.error(
                "Failed to check new grievances:",
                error
            );

        }

    }


    /* =====================================================
       LOGOUT
    ===================================================== */

    function logout() {

        localStorage.removeItem(
            "admin"
        );

        window.location.href =
            "/admin/admin-login.html";

    }


    /* =====================================================
       START
    ===================================================== */

    loadStatistics();

    loadRecentGrievances();

    checkForNewGrievances();


    /* Check every 5 seconds */

    setInterval(
        checkForNewGrievances,
        5000
    );

</script>


</body>

</html>
