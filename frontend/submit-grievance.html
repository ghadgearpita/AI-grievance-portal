<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Grievance</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .page {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 11px;
            margin-bottom: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="page">

        <a class="back" href="student-dashboard.html">
            ← Back to Dashboard
        </a>

        <div class="form-box">

            <h1>Submit Grievance</h1>

            <p>
                Describe your issue clearly so it can be reviewed by the concerned department.
            </p>


            <form id="grievanceForm">

                <label for="title">
                    Grievance Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Enter the title of your issue"
                    required
                >


                <label for="category">
                    Category
                </label>

                <select id="category" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Academic">
                        Academic
                    </option>

                    <option value="Hostel">
                        Hostel
                    </option>

                    <option value="Library">
                        Library
                    </option>

                    <option value="Examination">
                        Examination
                    </option>

                    <option value="Scholarship">
                        Scholarship
                    </option>

                    <option value="Infrastructure">
                        Infrastructure
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Describe your grievance..."
                    required
                ></textarea>


                <button type="submit">
                    Submit Grievance
                </button>

            </form>

        </div>

    </div>

<script>

    document.getElementById("grievanceForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const userData = localStorage.getItem("user");

        if (!userData) {
            alert("Please login first.");
            window.location.href = "login.html";
            return;
        }

        const user = JSON.parse(userData);

        const title = document.getElementById("title").value;
        const category = document.getElementById("category").value;
        const description = document.getElementById("description").value;

        const response = await fetch("/submit-grievance", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                student_id: user.id,
                title: title,
                category: category,
                description: description
            })

        });

        const data = await response.json();

        if (response.ok) {

            alert(
                "Grievance submitted successfully!\n\nYour Grievance ID: " +
                data.grievance_id
            );

            document.getElementById("grievanceForm").reset();

        } else {

            alert(data.message);

        }

    });

</script>

</body>

</html>
