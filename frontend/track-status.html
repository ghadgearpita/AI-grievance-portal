<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Grievance Status</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .page {
            max-width: 650px;
            margin: 60px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        input {
            width: 100%;
            padding: 11px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 25px;
        }

        .status-box {
            padding: 20px;
            background: #f8fafc;
            border-radius: 8px;
        }

        .status {
            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="page">

        <a class="back" href="student-dashboard.html">
            ← Back to Dashboard
        </a>

        <div class="box">

            <h1>Track Grievance Status</h1>

            <p>
                Enter your Grievance ID to check its current status.
            </p>

            <form id="trackForm">

                <input
                    type="text"
                    id="grievanceId"
                    placeholder="Example: GRV-0001"
                    required
                >

                <button type="submit">
                    Check Status
                </button>

            </form>

            <div id="result"></div>

        </div>

    </div>


    <script>

        document.getElementById("trackForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const grievanceId =
                document.getElementById("grievanceId").value.trim();

            const userData = localStorage.getItem("user");

            if (!userData) {

                alert("Please login first.");
                window.location.href = "login.html";
                return;

            }

            const user = JSON.parse(userData);

            const response = await fetch(
                "http://127.0.0.1:5000/track-status/" +
                grievanceId +
                "/" +
                user.id
            );

            const data = await response.json();

            const result = document.getElementById("result");

            if (response.ok) {

                result.innerHTML = `
                    <div class="status-box">

                        <p>
                            <strong>Grievance ID:</strong>
                            ${data.grievance_id}
                        </p>

                        <p>
                            <strong>Title:</strong>
                            ${data.title}
                        </p>

                        <p>
                            <strong>Category:</strong>
                            ${data.category}
                        </p>

                        <p class="status">
                            Status: ${data.status}
                        </p>

                    </div>
                `;

            } else {

                result.innerHTML = `
                    <div class="status-box">
                        ${data.message}
                    </div>
                `;

            }

        });

    </script>

</body>

</html>
